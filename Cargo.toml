[package]
name = "hermes"
version = "0.1.0"
edition = "2024"
description = "Hermes Client launcher"

[profile.release]
lto = "thin"
codegen-units = 1

[dependencies]
anyhow = "1.0.104"
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "glow"] }
futures = "0.3.34"
image = { version = "0.25.10", default-features = false, features = ["png"] }
raw-window-handle = "0.6"
reqwest = { version = "0.13.5", default-features = false, features = ["http2", "native-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "fs"] }
uuid = "1.29.2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }
windows-version = "0.100.0"

[build-dependencies]
winresource = "0.1.34"
