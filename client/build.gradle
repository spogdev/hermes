// Hermes Client: the in-game half of Hermes. The launcher bundles the built jar
// and loads it into every game it starts (see src/client_mod.rs in the launcher).
// Minecraft 26.1 ships unobfuscated, so this uses Loom without mappings.
plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = 'dev.spog'

base {
    archivesName = 'hermes-client'
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

// A fixed name, so the launcher can embed it without knowing the version.
jar {
    archiveFileName = 'hermes-client.jar'
}
